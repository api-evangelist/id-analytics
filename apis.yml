name: Id Analytics
description: >-
  ID Analytics was a San Diego-based identity risk and fraud analytics company founded in 2002. It
  operated the ID Network, a cross-industry consortium of consumer identity behavior, and productized
  it as ID Score and related fraud-detection, credit-risk, and identity-verification analytics used by
  financial services, telecommunications, and government. The company was acquired by LifeLock in 2012,
  passed to Symantec when it bought LifeLock in 2017, and was sold to LexisNexis Risk Solutions in 2020,
  where its capabilities are now delivered. It no longer operates an independent developer portal or
  public API; idanalytics.com now redirects to LexisNexis Risk Solutions.
